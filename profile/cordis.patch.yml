# DST-Moon profile patch — the LOCAL-model harness.
#
# Installed to %USERPROFILE%\.dsh\profiles\dst-moon\cordis.patch.yml by
# scripts\install-fork.bat (the file is the source of truth; edit it here,
# re-run the installer or copy it over). Completely separate from any sibling
# dsh-tui profile: own TUI fork tarball, own engine fork tarballs, own data
# dir (~/.dst-moon), and NO MCP servers ride along — DST-Comet's
# Constellation and its 59-77 tool schemas stay on the Comet side. That was
# the point: a local model's first hello should not cost 33k tokens.
#
# House policy (strict folder rule): the agent may only WRITE inside the
# workspace it was launched in. Reads elsewhere are fine; every mutation
# outside the workspace root is denied (fs-sandbox), and the few privileged
# operations ask first. See the sandbox-policy / approval rows at the bottom.

- id: dsh-tui
  name: "@deepseek-harness-tui/dsh-tui"
  config:
    # The only provider: a local llama.cpp server (OpenAI-compatible).
    # Start it from C:\Code\Ai_Model (all launchers use 127.0.0.1:8080).
    # `model` resolves at boot from DSH_LLAMA_MODELS (the launcher probes
    # GET /v1/models) — the name shown and requested IS the running alias.
    provider: llama-local
    model: !!js "(process.env.DSH_LLAMA_MODELS ?? 'Qwen36-35B-ablit').split('|').filter(s => s.length > 0)[0] || 'Qwen36-35B-ablit'"
    # liangshen = the TUI's curated lean preset: minimal bootstrap tool face
    # (opens after the first tool call), persona with runtime-context
    # suppression. The harness DEFAULT preset mounts the time-context plugin,
    # whose per-turn "Time sampled... / Browser time zone: unavailable. Ask
    # the user to clarify..." block a local model reads literally and rambles
    # about on every hello — liangshen does not mount it.
    preset: !!js process.env.DSH_TUI_PRESET || 'liangshen'
    workspace: !!js process.env.DSH_TUI_WORKSPACE_TARGET ?? undefined
    sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? undefined
    backend: !!js process.env.DSH_TUI_BACKEND || undefined
    whaleIdle: true
    whaleGirl: true
    minimal: false
    fullscreen: true
    terminalImages: true
    lang: en
    toolBackground: none
    pageMargin: normal
    companion: { skin: whale }

# Local model route. pi-ai's openai-completions adapter is the right shape
# for llama.cpp; the dummy Authorization header satisfies its "no API key"
# guard because the launchers run llama-server WITHOUT --api-key.
# The models list MUST be explicit (a hand-declared route resolves no models
# from the installed catalog — catalog.ts refuses without configuration), so
# the launcher probes GET /v1/models at launch and passes the running
# aliases pipe-separated in DSH_LLAMA_MODELS; this list is materialized from
# that at boot — auto-detect of whatever start-*.bat is loaded. Server down
# or alias unknown -> the first-run default below. A pinned default that is
# not in the live list adopts the first running alias (modelRoute.ts
# auto-detect); /model switches and persist.
# Per-alias contextWindow: the launcher also parses the rig's start-*.bat
# files (--alias X + -c N) into DSH_LLAMA_CTX (alias:ctx pipe pairs), and
# each catalog entry carries its real window — bonsai declares 32768, the
# 262k models declare 262144 — so the context bar and pressure warnings
# follow the model that is actually loaded. No ctx known (bats unreadable,
# default fallback) -> the route-level defaultContextWindow: deliberately
# 131072, half of the 262144 KV — CometStream ops lore says quality on these
# finetunes rots past ~80-150k. maxTokens 32768 matches the launchers' "set
# max_tokens HIGH (4K+) or thinking eats the reply budget" note.
# thinkingFormat deepseek maps reasoning_content to the thinking renderer,
# and the adapter reads llama.cpp's prompt_tokens_details.cached_tokens into
# cacheRead — the TUI's cache-hit % / prefill telemetry ride on that.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      llama-local:
        displayName: llama.cpp (local)
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        headers:
          Authorization: "Bearer no-key"
        defaultContextWindow: 131072
        defaultMaxTokens: 32768
        compat:
          maxTokensField: max_tokens
          thinkingFormat: deepseek
        models: !!js "(() => { const ids = (process.env.DSH_LLAMA_MODELS ?? 'Qwen36-35B-ablit').split('|').filter(id => id.length > 0); const ctx = Object.fromEntries((process.env.DSH_LLAMA_CTX ?? '').split('|').filter(s => s.length > 0).map(s => { const i = s.indexOf(':'); return [s.slice(0, i).toLowerCase(), Number(s.slice(i + 1))] })); return ids.map(id => { const w = ctx[id.toLowerCase()]; return { id, name: id, ...(Number.isInteger(w) && w !== undefined && w > 0 ? { contextWindow: w } : {}) } }) })()"

# Compaction, pinned at the engine defaults so the knobs are visible and
# flip-ready for weak local summarizers: compact when request pressure
# crosses 80% of the DECLARED window (which follows the loaded alias —
# ~26k on bonsai-32k, ~210k on the 262k models), keep a 16% verbatim tail.
# If summaries read lossy, raise retainRatio (more verbatim) or lower
# thresholdRatio (compact earlier, smaller summaries) — per-alias via
# modelPolicies if one model needs different behavior.
- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16

# STRICT FOLDER RULE: writes stay inside the launch workspace. This replaces
# the dsh-tui bundle's Windows default (danger-full-access + never-ask) with
# workspace-write + ask — a local model on your own machine should not be
# able to touch anything outside the project you pointed it at. Relax
# per-session with /permission if a task truly needs more.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
    additionalWritableRoots: []
- id: approval
  config:
    policy: ask
